    <line x1="-58" y1="-165" x2="58" y2="-165" stroke="#C9A45C" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="-56" y1="-195" x2="56" y2="-195" stroke="#C9A45C" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="-58" y1="165" x2="58" y2="165" stroke="#C9A45C" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="-56" y1="195" x2="56" y2="195" stroke="#C9A45C" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="-136" y="-56" width="14" height="28" rx="3" fill="#171613" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="-136" y="28" width="14" height="28" rx="3" fill="#171613" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="122" y="-56" width="14" height="28" rx="3" fill="#171613" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="122" y="28" width="14" height="28" rx="3" fill="#171613" stroke="url(#goldGrad)" stroke-width="2"/>
    <polygon points="-75,-124 75,-124 124,-75 124,75 75,124 -75,124 -124,75 -124,-75" fill="#10100E" stroke="url(#goldGrad)" stroke-width="4"/>
    <polygon points="-64,-108 64,-108 108,-64 108,64 64,108 -64,108 -108,64 -108,-64" fill="#151411" stroke="#C9A45C" stroke-opacity="0.4" stroke-width="1.5"/>
    <rect x="-82" y="-56" width="164" height="112" rx="10" fill="#0A0D0B" stroke="#C9A45C" stroke-opacity="0.6" stroke-width="1.8"/>
    <text x="0" y="-26" text-anchor="middle" fill="#8D8980" font-family="monospace" font-size="14" letter-spacing="3">MON 25</text>
    <text x="0" y="22" text-anchor="middle" fill="#E8D5A7" font-family="monospace" font-size="40" font-weight="bold" letter-spacing="2">10:08</text>
    <text x="0" y="44" text-anchor="middle" fill="#C9A45C" font-family="monospace" font-size="12" letter-spacing="2">CHRONO • WR 200M</text>
    
