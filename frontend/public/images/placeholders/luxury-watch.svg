<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="LUXURY CHRONOGRAPH">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#221E17"/>
      <stop offset="55%" stop-color="#13120F"/>
      <stop offset="100%" stop-color="#090908"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2DFB0"/>
      <stop offset="45%" stop-color="#C9A45C"/>
      <stop offset="100%" stop-color="#8E6C2E"/>
    </linearGradient>
    <linearGradient id="goldSoft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8D5A7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C9A45C" stop-opacity="0.06"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bgGrad)"/>

  <!-- Subtle guilloche horological background rings -->
  <g fill="none" stroke="#C9A45C" stroke-opacity="0.10">
    <circle cx="400" cy="435" r="238" stroke-width="1"/>
    <circle cx="400" cy="435" r="199" stroke-width="1" stroke-dasharray="4 8"/>
    <circle cx="400" cy="435" r="165" stroke-width="1"/>
  </g>

  <!-- Subtle framing border -->
  <rect x="24" y="24" width="752" height="952" rx="18" fill="none" stroke="#2A261F" stroke-width="1.5"/>

  <!-- Top Heritage Mark -->
  <text x="400" y="68" text-anchor="middle" fill="#8D8980" font-family="Georgia, 'Times New Roman', serif" font-size="14" letter-spacing="6">MEGHANI WATCH CO.</text>
  <line x1="345" y1="84" x2="455" y2="84" stroke="#C9A45C" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Main Horological Vector -->
  <g transform="translate(400, 435) scale(0.85)">
    
    <g fill="#171613" stroke="url(#goldGrad)" stroke-width="1.8">
      <rect x="-56" y="-162" width="112" height="34" rx="4"/>
      <rect x="-52" y="-198" width="104" height="34" rx="4"/>
      <rect x="-48" y="-234" width="96" height="34" rx="4"/>
      <rect x="-56" y="128" width="112" height="34" rx="4"/>
      <rect x="-52" y="164" width="104" height="34" rx="4"/>
      <rect x="-48" y="200" width="96" height="34" rx="4"/>
    </g>
    <rect x="128" y="-62" width="14" height="22" rx="3" transform="rotate(25 128 -52)" fill="#171613" stroke="url(#goldGrad)" stroke-width="2"/>
    <rect x="132" y="-16" width="18" height="32" rx="4" fill="#171613" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <rect x="128" y="40" width="14" height="22" rx="3" transform="rotate(-25 128 52)" fill="#171613" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="134" fill="#0F0E0B" stroke="url(#goldGrad)" stroke-width="5"/>
    <circle cx="0" cy="0" r="120" fill="#141310" stroke="#C9A45C" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="0.0" y1="-100.0" x2="0.0" y2="-112.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="50.0" y1="-86.6" x2="56.0" y2="-97.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="86.6" y1="-50.0" x2="97.0" y2="-56.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="100.0" y1="-0.0" x2="112.0" y2="-0.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="86.6" y1="50.0" x2="97.0" y2="56.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="50.0" y1="86.6" x2="56.0" y2="97.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="0.0" y1="100.0" x2="0.0" y2="112.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="-50.0" y1="86.6" x2="-56.0" y2="97.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="-86.6" y1="50.0" x2="-97.0" y2="56.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="-100.0" y1="0.0" x2="-112.0" y2="0.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="-86.6" y1="-50.0" x2="-97.0" y2="-56.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/><line x1="-50.0" y1="-86.6" x2="-56.0" y2="-97.0" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-48" cy="0" r="26" fill="#0B0B0A" stroke="#C9A45C" stroke-opacity="0.55" stroke-width="1.3"/>
    <circle cx="48" cy="0" r="26" fill="#0B0B0A" stroke="#C9A45C" stroke-opacity="0.55" stroke-width="1.3"/>
    <circle cx="0" cy="52" r="26" fill="#0B0B0A" stroke="#C9A45C" stroke-opacity="0.55" stroke-width="1.3"/>
    <line x1="0" y1="10" x2="-46" y2="-32" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="60" y2="-48" stroke="#F3EFE6" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="7" fill="url(#goldGrad)"/>
    
  </g>

  <!-- Category / Type Title -->
  <text x="400" y="876" text-anchor="middle" fill="#F3EFE6" font-family="Georgia, 'Times New Roman', serif" font-size="24" letter-spacing="1.5">LUXURY CHRONOGRAPH</text>
  <text x="400" y="902" text-anchor="middle" fill="#C9A45C" font-family="Arial, Helvetica, sans-serif" font-size="12" letter-spacing="3">HAUTE HORLOGERIE</text>

  <!-- Bottom Neutral Pill -->
  <rect x="195" y="922" width="410" height="34" rx="17" fill="#171613" stroke="#2A261F" stroke-width="1.2"/>
  <text x="400" y="943" text-anchor="middle" fill="#8D8980" font-family="Arial, Helvetica, sans-serif" font-size="10.5" letter-spacing="2">REPRESENTATIVE ILLUSTRATION • PHOTO PENDING</text>
</svg>
